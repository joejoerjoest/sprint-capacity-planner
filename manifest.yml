modules:
  jira:projectPage:
    - key: sprint-capacity-planner-hello-world-project-page
      resource: main
      resolver:
        function: resolver
      title: sprint-capacity-planner
  function:
    - key: resolver
      handler: index.handler
permissions:
  scopes:
    - storage:app
    - read:board-scope:jira-software
    - read:sprint:jira-software
    - read:issue:jira-software
    - read:field:jira
    - read:user:jira
resources:
  - key: main
    path: static/hello-world/build
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/69b3afca-3d4f-4220-ad79-211e47a5ac4d
